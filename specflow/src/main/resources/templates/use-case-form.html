<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'New Use Case')}">
<body>

<section th:fragment="content">

    <div class="form-container">

        <!-- ================= BREADCRUMB ================= -->
        <div class="breadcrumb">

            <a th:href="@{/projects}">
                My Projects
            </a>

            &rsaquo;

            <a th:href="@{/projects/{id}(id=${project.id})}"
               th:text="${project.name}">
                Project
            </a>

            &rsaquo;

            New Use Case

        </div>

        <!-- ================= PAGE TITLE ================= -->
        <h1>Create Use Case</h1>

        <!-- ================= ERROR MESSAGE ================= -->
        <div th:if="${errorMessage}"
             class="alert alert-error"
             th:text="${errorMessage}">
        </div>

        <!-- ================= FORM ================= -->
        <form th:action="@{/projects/{projectId}/usecases(projectId=${project.id})}"
              method="post"
              th:object="${useCaseDto}">

            <!-- ================= USE CASE NAME ================= -->
            <div class="form-group">

                <label for="name">
                    Use Case Name
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="e.g. User Login">

            </div>

            <!-- ================= ACTORS ================= -->
            <div class="form-group">

                <label for="actors">
                    Actors
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="actors"
                       name="actors"
                       class="form-control"
                       placeholder="e.g. User, Administrator, External API">

                <div class="hint-text">
                    Enter actors separated by commas.
                </div>

            </div>

            <!-- ================= PRECONDITION ================= -->
            <div class="form-group">

                <label for="precondition">
                    Precondition
                </label>

                <textarea id="precondition"
                          th:field="*{precondition}"
                          class="form-control"
                          rows="3"
                          placeholder="Describe the required conditions before the use case can be executed..."></textarea>

            </div>

            <!-- ================= MAIN FLOW ================= -->
            <div class="form-group">

                <label for="mainFlow">
                    Main Flow
                    <span class="required">*</span>
                </label>

                <textarea id="mainFlow"
                          th:field="*{mainFlow}"
                          class="form-control"
                          rows="6"
                          placeholder="Step-by-step description of the main workflow..."></textarea>

            </div>

            <!-- ================= ALTERNATIVE FLOW ================= -->
            <div class="form-group">

                <label for="alternativeFlow">
                    Alternative Flow
                </label>

                <textarea id="alternativeFlow"
                          th:field="*{alternativeFlow}"
                          class="form-control"
                          rows="4"
                          placeholder="Describe alternative scenarios or exceptions..."></textarea>

            </div>

            <!-- ================= POSTCONDITION ================= -->
            <div class="form-group">

                <label for="postcondition">
                    Postcondition
                </label>

                <textarea id="postcondition"
                          th:field="*{postcondition}"
                          class="form-control"
                          rows="3"
                          placeholder="Describe the state after successful execution..."></textarea>

            </div>

            <!-- ================= ACTION BUTTONS ================= -->
            <div class="form-actions"
                 style="display:flex; gap: 0.8rem;">

                <button type="submit"
                        class="btn btn-primary">

                    Save

                </button>

                <a th:href="@{/projects/{id}(id=${project.id})}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</section>

</body>
</html>
