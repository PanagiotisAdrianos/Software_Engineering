<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Change Role')}">
<body>
<section th:fragment="content">
    <div class="form-container">
        <div class="breadcrumb">
            <a th:href="@{/}">Homepage</a> &rsaquo;
            <a th:href="@{/admin/users}">User Management</a> &rsaquo; Change Role
        </div>
        <h1>Change Role</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" th:value="${user.username}" readonly>
            </div>

            <div class="form-group">
                <label>Current Role</label>
                <input type="text" class="form-control" th:value="${user.role}" readonly>
            </div>

            <div class="form-group">
                <label for="newRole">New Role</label>
                <select id="newRole" name="newRole" class="form-control" style="max-width: 280px;">
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}"
                            th:selected="${r == user.role}"></option>
                </select>
            </div>

            <div class="form-actions" style="display:flex; gap: 0.8rem;">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
