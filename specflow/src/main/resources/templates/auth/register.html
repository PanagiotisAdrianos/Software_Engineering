<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Register')}">
<body>
<section th:fragment="content">

    <div class="form-container">

        <h1>Register</h1>
        <p class="form-subtitle">Create a new account</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerDto}">

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" th:field="*{username}"
                       class="form-control" placeholder="Enter username">
                <span th:if="${#fields.hasErrors('username')}"
                      th:errors="*{username}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}"
                       class="form-control" placeholder="Enter email">
                <span th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" th:field="*{password}"
                       class="form-control" placeholder="At least 6 characters">
                <span th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}" class="field-error"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register</button>
                <a th:href="@{/login}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

        <p class="form-link">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>

    </div>

</section>
</body>
</html>
