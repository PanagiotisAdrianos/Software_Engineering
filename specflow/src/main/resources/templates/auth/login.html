<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Login')}">
<body>
<section th:fragment="content">
    <div class="form-container">

        <h1>Login</h1>
        <p class="form-subtitle">Welcome to SpecFlow</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post" th:object="${loginDto}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}"
                       class="form-control" placeholder="Enter username">
                <span th:if="${#fields.hasErrors('username')}"
                      th:errors="*{username}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"
                       class="form-control" placeholder="Enter password">
                <span th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}" class="field-error"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>

        </form>

        <p class="form-link">
            Don't have an account?
            <a th:href="@{/register}">Register</a>
        </p>

    </div>
</section>
</body>
</html>
