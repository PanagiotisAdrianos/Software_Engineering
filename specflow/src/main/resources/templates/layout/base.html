<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content, pageTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — SpecFlow'">SpecFlow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/projects}" class="nav-brand">SpecFlow</a>
    <ul class="nav-links">
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/projects}">Projects</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/profile}">Profile</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/users}">Admin</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn-link">Logout</button>
            </form>
        </li>
    </ul>
</nav>
<div class="container">
    <div th:replace="~{fragments/flash-messages :: messages}"></div>
</div>
<main class="container">
    <div th:replace="${content}"></div>
</main>
<footer class="footer">
    <p>SpecFlow — Requirements Specification App</p>
</footer>
</body>
</html>
