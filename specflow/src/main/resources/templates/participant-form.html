<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Add Participant')}">
<body>
<section th:fragment="content">
    <div class="form-container">
        <div class="breadcrumb">
            <a th:href="@{/projects}">My Projects</a> &rsaquo;
            <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Project</a> &rsaquo;
            <a th:href="@{/projects/{id}/participants(id=${project.id})}">Participants</a> &rsaquo;
            New Participant
        </div>
        <h1>Add Participant</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/projects/{id}/participants(id=${project.id})}" method="post">
            <div class="form-group">
                <label for="username">Username <span class="required">*</span></label>
                <input type="text" id="username" name="username" class="form-control"
                       th:value="${participantUsername}" required>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" class="form-control" style="max-width: 240px;">
                    <option value="COLLABORATOR"
                            th:selected="${participantRole == 'COLLABORATOR'}">COLLABORATOR</option>
                    <option value="REVIEWER"
                            th:selected="${participantRole == 'REVIEWER'}">REVIEWER</option>
                </select>
            </div>

            <div class="form-actions" style="display:flex; gap: 0.8rem;">
                <button type="submit" class="btn btn-primary">Add</button>
                <a th:href="@{/projects/{id}/participants(id=${project.id})}"
                   class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
