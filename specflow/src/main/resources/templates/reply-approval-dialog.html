<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Reply Approval')}">
<body>
<section th:fragment="content">
    <div class="form-container">
        <div class="confirm-dialog card">
            <h2>Reply Approval</h2>
            <p>Do you approve this use case?</p>
            <p class="page-subtitle">
                Use Case: <strong th:text="${useCase.name}">Name</strong>
            </p>

            <div class="form-actions" style="margin-top: 1.2rem; display:flex; gap: 0.8rem;">
                <form th:action="@{/projects/{pid}/usecases/{id}/approve(pid=${project.id}, id=${useCase.id})}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn btn-primary">Approve</button>
                </form>
                <a th:href="@{/projects/{pid}/usecases/{id}/reject-dialog(pid=${project.id}, id=${useCase.id})}"
                   class="btn btn-danger">Reject</a>
                <a th:href="@{/projects/{pid}/usecases/{id}(pid=${project.id}, id=${useCase.id})}"
                   class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
