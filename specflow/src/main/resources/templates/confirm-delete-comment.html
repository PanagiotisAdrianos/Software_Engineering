<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Επιβεβαίωση Διαγραφής')}">
<body>
<section th:fragment="content">
    <div class="form-container">
        <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post"
              class="confirm-dialog card">
            <input type="hidden" name="targetType" th:value="${targetType}">
            <input type="hidden" name="targetId" th:value="${targetId}">
            <input type="hidden" name="projectId" th:value="${projectId}">
            <h2>Delete Comment</h2>
            <p>Are you sure you want to delete this comment? This action cannot be undone.</p>
            <div class="form-actions" style="margin-top: 1.2rem; display: flex; gap: 0.8rem;">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a th:if="${targetType == 'USE_CASE'}"
                   th:href="@{/projects/{pid}/usecases/{id}(pid=${projectId}, id=${targetId})}"
                   class="btn btn-secondary">Cancel</a>
                <a th:if="${targetType == 'CRC_CARD'}"
                   th:href="@{/projects/{pid}/crccards/{id}(pid=${projectId}, id=${targetId})}"
                   class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
