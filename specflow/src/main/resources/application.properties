spring.application.name=specflow

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/specflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Athens
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JWT
jwt.secret=specflow-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000

# Server
server.port=8080
